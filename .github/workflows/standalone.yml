name: Standalone installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.26'
      - run: uv run --python 3.12 python scripts/build_standalone.py
      - run: uv run --python 3.12 python scripts/smoke_standalone.py dist/standalone/*.run
      - uses: actions/upload-artifact@v7
        with:
          name: research-cli-${{ matrix.platform }}
          path: |
            dist/standalone/*.run
            dist/standalone/*.run.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
