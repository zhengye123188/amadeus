name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv run research-legacy --demo exec '读取 @README.md' --json
      - run: uv run python examples/retrieval_lab/run.py --output /tmp/retrieval-metrics.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run eval:memory
      - run: npm pack --dry-run
      - run: npm pack --pack-destination /tmp
      - run: node scripts/smoke_npm.mjs /tmp/lelouch_021015-research-cli-0.2.0.tgz
      - run: uv run python scripts/smoke_install.py dist/*.whl
