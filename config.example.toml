# v0.2 Python research backend settings. Launch: research --config research.toml
# Only an explicitly supplied file is loaded. Never put literal API keys here.
# Pi model/auth: /model, --provider/--model, OPENAI_API_KEY, OPENAI_BASE_URL,
# RESEARCH_MODEL, RESEARCH_API. Legacy model-loop limits do not control Pi.
#
# --permission, --execution and --offline are launcher policy options.
docker_image = "python:3.11-slim" # prepare locally; an immutable digest is preferable
tool_timeout = 90
tool_result_chars = 10000
max_job_seconds = 600
max_job_output_bytes = 2000000
# Optional embedding API (independent of Pi's chat model and billing):
# embedding_model = "your-embedding-model"
# base_url = "https://your-embedding-provider.example/v1"
api_key_env = "OPENAI_API_KEY"
